<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Crawler — Monitor de Preços</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f12;
      --bg2:       #13161b;
      --bg3:       #1a1e26;
      --border:    #252933;
      --border2:   #2e3340;
      --text:      #e8eaf0;
      --muted:     #636b7d;
      --muted2:    #8b93a5;
      --accent:    #4fffb0;
      --accent2:   #00c97a;
      --warn:      #ffb84f;
      --danger:    #ff5f6d;
      --blue:      #4f9fff;
      --purple:    #b57fff;
      --mono:      'DM Mono', monospace;
      --sans:      'DM Sans', sans-serif;
      --display:   'Syne', sans-serif;
      --radius:    10px;
      --radius-lg: 16px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Grain overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.4;
    }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,15,18,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .logo {
      font-family: var(--display);
      font-size: 18px; font-weight: 800;
      letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 10px;
    }
    .logo-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .header-right {
      display: flex; align-items: center; gap: 16px;
    }
    .last-update {
      font-family: var(--mono);
      font-size: 11px; color: var(--muted);
    }
    .last-update span { color: var(--accent2); }

    /* ── Main layout ── */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 32px 64px;
      position: relative; z-index: 1;
    }

    /* ── Stats bar ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      position: relative; overflow: hidden;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: var(--border2); }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
    }
    .stat-card.c-green::before { background: linear-gradient(90deg, var(--accent), transparent); }
    .stat-card.c-warn::before  { background: linear-gradient(90deg, var(--warn), transparent); }
    .stat-card.c-blue::before  { background: linear-gradient(90deg, var(--blue), transparent); }
    .stat-card.c-purple::before{ background: linear-gradient(90deg, var(--purple), transparent); }

    .stat-label {
      font-family: var(--mono);
      font-size: 10px; font-weight: 500;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 8px;
    }
    .stat-value {
      font-family: var(--display);
      font-size: 28px; font-weight: 700;
      line-height: 1;
    }
    .stat-card.c-green .stat-value { color: var(--accent); }
    .stat-card.c-warn  .stat-value { color: var(--warn); }
    .stat-card.c-blue  .stat-value { color: var(--blue); }
    .stat-card.c-purple.stat-value { color: var(--purple); }

    /* ── Controls ── */
    .controls {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }

    .search-wrap {
      position: relative; flex: 1; min-width: 200px;
    }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none; font-size: 14px;
    }
    input[type="text"],
    select {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    input[type="text"] { padding-left: 36px; }
    input[type="text"]:focus,
    select:focus { border-color: var(--accent2); }
    select { cursor: pointer; min-width: 140px; width: auto; }
    select option { background: var(--bg3); }

    .controls-divider {
      width: 1px; height: 32px;
      background: var(--border); flex-shrink: 0;
    }

    .btn-group { display: flex; gap: 6px; }

    .btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted2);
      font-family: var(--mono);
      font-size: 11px; font-weight: 500;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--border2); color: var(--text); }
    .btn.active {
      background: rgba(79,255,176,0.08);
      border-color: var(--accent2);
      color: var(--accent);
    }

    /* ── Table ── */
    .table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      font-family: var(--mono);
      font-size: 10px; font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }
    thead th:hover { color: var(--text); }
    thead th.sorted { color: var(--accent); }
    thead th .sort-arrow { margin-left: 4px; opacity: 0.4; }
    thead th.sorted .sort-arrow { opacity: 1; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg3); }

    td {
      padding: 14px 16px;
      vertical-align: middle;
    }

    /* Site badge */
    .site-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 11px; font-weight: 500;
      padding: 3px 9px; border-radius: 20px;
      white-space: nowrap;
    }
    .site-badge.ml     { background: rgba(255,184,79,0.12); color: var(--warn); border: 1px solid rgba(255,184,79,0.25); }
    .site-badge.amz    { background: rgba(79,159,255,0.12); color: var(--blue); border: 1px solid rgba(79,159,255,0.25); }
    .site-badge.pm     { background: rgba(181,127,255,0.12); color: var(--purple); border: 1px solid rgba(181,127,255,0.25); }
    .site-badge.panvel { background: rgba(79,255,176,0.10); color: var(--accent); border: 1px solid rgba(79,255,176,0.2); }
    .site-badge.other  { background: rgba(232,234,240,0.07); color: var(--muted2); border: 1px solid var(--border); }

    /* Produto name */
    .prod-name {
      font-weight: 500; font-size: 13px;
      color: var(--text); line-height: 1.4;
      max-width: 300px;
    }
    .prod-query {
      font-family: var(--mono); font-size: 10px;
      color: var(--muted); margin-top: 2px;
    }

    /* Price */
    .price-col { white-space: nowrap; }
    .price-main {
      font-family: var(--display);
      font-size: 16px; font-weight: 700;
      color: var(--accent);
    }
    .price-original {
      font-family: var(--mono);
      font-size: 11px; color: var(--muted);
      text-decoration: line-through;
      margin-top: 1px;
    }

    /* Promo badge */
    .promo-badge {
      display: inline-block;
      font-family: var(--mono); font-size: 10px; font-weight: 500;
      padding: 3px 8px; border-radius: 6px;
      background: rgba(255,95,109,0.12);
      color: var(--danger);
      border: 1px solid rgba(255,95,109,0.25);
      max-width: 200px;
      line-height: 1.4;
    }
    .promo-none { color: var(--muted); font-size: 12px; }

    /* Date */
    .date-col {
      font-family: var(--mono); font-size: 11px;
      color: var(--muted2); white-space: nowrap;
    }
    .date-today { color: var(--accent2); }

    /* Link */
    .link-col a {
      color: var(--muted);
      font-size: 13px;
      transition: color 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .link-col a:hover { color: var(--accent); }

    /* ── Empty state ── */
    .empty {
      padding: 80px 32px;
      text-align: center;
    }
    .empty-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
    .empty h3 {
      font-family: var(--display); font-size: 18px;
      color: var(--muted2); margin-bottom: 8px;
    }
    .empty p { color: var(--muted); font-size: 13px; max-width: 360px; margin: 0 auto; }

    /* ── Footer count ── */
    .table-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg3);
      display: flex; justify-content: space-between; align-items: center;
    }
    .count-text {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
    }
    .count-text strong { color: var(--text); }

    /* ── Loading ── */
    #loading {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 999; gap: 20px;
    }
    .loader-ring {
      width: 44px; height: 44px;
      border: 2px solid var(--border2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-family: var(--mono); font-size: 12px;
      color: var(--muted); letter-spacing: 0.05em;
    }

    /* ── Animations ── */
    .fade-in { animation: fadeIn 0.3s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      main { padding: 20px 16px 48px; }
      header { padding: 0 16px; }
    }
    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .controls { flex-direction: column; align-items: stretch; }
      .controls-divider { display: none; }
      select { width: 100%; }
      .prod-name { max-width: 160px; }
      thead th:nth-child(4),
      tbody td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading">
    <div class="loader-ring"></div>
    <div class="loader-text">carregando preços...</div>
  </div>

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      Price Crawler
    </div>
    <div class="header-right">
      <div class="last-update" id="last-update">—</div>
    </div>
  </header>

  <!-- Main -->
  <main id="app" style="display:none">

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card c-green">
        <div class="stat-label">Registros hoje</div>
        <div class="stat-value" id="stat-hoje">—</div>
      </div>
      <div class="stat-card c-blue">
        <div class="stat-label">Produtos monitorados</div>
        <div class="stat-value" id="stat-produtos">—</div>
      </div>
      <div class="stat-card c-warn">
        <div class="stat-label">Com promoção</div>
        <div class="stat-value" id="stat-promo">—</div>
      </div>
      <div class="stat-card c-purple">
        <div class="stat-label">Sites rastreados</div>
        <div class="stat-value" id="stat-sites">—</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="busca" placeholder="Buscar produto, site ou promoção..." oninput="filtrar()">
      </div>

      <select id="filtro-site" onchange="filtrar()">
        <option value="">Todos os sites</option>
      </select>

      <select id="filtro-data" onchange="filtrar()">
        <option value="">Todas as datas</option>
      </select>

      <div class="controls-divider"></div>

      <div class="btn-group">
        <button class="btn active" id="btn-todos" onclick="filtrarPromo('todos')">Todos</button>
        <button class="btn" id="btn-promo" onclick="filtrarPromo('promo')">Com promoção</button>
      </div>

      <div class="controls-divider"></div>

      <select id="ordenar" onchange="filtrar()">
        <option value="data_desc">Mais recentes</option>
        <option value="preco_asc">Menor preço</option>
        <option value="preco_desc">Maior preço</option>
        <option value="nome_asc">Nome A→Z</option>
      </select>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Site</th>
            <th>Produto</th>
            <th>Preço</th>
            <th>Promoção</th>
            <th>Data</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none">
        <div class="empty-icon">◎</div>
        <h3>Nenhum resultado encontrado</h3>
        <p>Tente ajustar os filtros ou aguarde a próxima coleta automática.</p>
      </div>
      <div class="table-footer">
        <div class="count-text" id="count-text">—</div>
      </div>
    </div>

  </main>

  <script>
    let dados = [];
    let modoPromo = 'todos';
    const hoje = new Date().toISOString().split('T')[0];

    // ── Carregar dados ────────────────────────────────────────
    fetch('prices.json')
      .then(r => {
        if (!r.ok) throw new Error('prices.json não encontrado');
        return r.json();
      })
      .then(d => {
        dados = d;
        inicializar();
      })
      .catch(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('tabela').innerHTML = '';
        document.getElementById('empty').style.display = 'block';
        document.getElementById('empty').querySelector('h3').textContent = 'prices.json não encontrado';
        document.getElementById('empty').querySelector('p').textContent =
          'Execute o crawler.py primeiro para gerar os dados de preços.';
      });

    // ── Inicializar ───────────────────────────────────────────
    function inicializar() {
      preencherFiltros();
      atualizarStats();
      filtrar();

      // Última atualização
      const datas = dados.map(d => d.data).sort().reverse();
      if (datas.length) {
        const d = datas[0];
        const label = d === hoje ? 'hoje' : d;
        document.getElementById('last-update').innerHTML =
          `Última coleta: <span>${label}</span>`;
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }

    // ── Preencher selects ─────────────────────────────────────
    function preencherFiltros() {
      const sites = [...new Set(dados.map(d => d.site))].sort();
      const datas = [...new Set(dados.map(d => d.data))].sort().reverse();

      const selSite = document.getElementById('filtro-site');
      sites.forEach(s => {
        const o = document.createElement('option');
        o.value = s; o.textContent = s;
        selSite.appendChild(o);
      });

      const selData = document.getElementById('filtro-data');
      datas.forEach(d => {
        const o = document.createElement('option');
        o.value = d;
        o.textContent = d === hoje ? `${d} (hoje)` : d;
        selData.appendChild(o);
      });
    }

    // ── Stats ─────────────────────────────────────────────────
    function atualizarStats() {
      const deHoje = dados.filter(d => d.data === hoje);
      const comPromo = dados.filter(d => d.promocao);
      const sites = new Set(dados.map(d => d.site));
      const produtos = new Set(dados.map(d => d.produto_buscado));

      document.getElementById('stat-hoje').textContent     = deHoje.length;
      document.getElementById('stat-produtos').textContent = produtos.size;
      document.getElementById('stat-promo').textContent    = comPromo.length;
      document.getElementById('stat-sites').textContent    = sites.size;
    }

    // ── Filtrar / renderizar ──────────────────────────────────
    function filtrarPromo(modo) {
      modoPromo = modo;
      document.getElementById('btn-todos').classList.toggle('active', modo === 'todos');
      document.getElementById('btn-promo').classList.toggle('active', modo === 'promo');
      filtrar();
    }

    function filtrar() {
      const busca  = document.getElementById('busca').value.toLowerCase().trim();
      const site   = document.getElementById('filtro-site').value;
      const data   = document.getElementById('filtro-data').value;
      const ordem  = document.getElementById('ordenar').value;

      let filtrado = dados.filter(d => {
        if (modoPromo === 'promo' && !d.promocao) return false;
        if (site && d.site !== site) return false;
        if (data && d.data !== data) return false;
        if (busca) {
          const haystack = [d.nome, d.produto_buscado, d.site, d.promocao || '']
            .join(' ').toLowerCase();
          if (!haystack.includes(busca)) return false;
        }
        return true;
      });

      // Ordenação
      filtrado.sort((a, b) => {
        switch(ordem) {
          case 'preco_asc':  return (a.preco || 0) - (b.preco || 0);
          case 'preco_desc': return (b.preco || 0) - (a.preco || 0);
          case 'nome_asc':   return a.nome.localeCompare(b.nome);
          default:           return b.data.localeCompare(a.data);
        }
      });

      renderTabela(filtrado);

      const countEl = document.getElementById('count-text');
      countEl.innerHTML = `Mostrando <strong>${filtrado.length}</strong> de <strong>${dados.length}</strong> registros`;
    }

    // ── Render ────────────────────────────────────────────────
    function renderTabela(rows) {
      const tbody = document.getElementById('tabela');
      const empty = document.getElementById('empty');

      if (!rows.length) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = rows.map((d, i) => {
        const siteCls   = getSiteClass(d.site);
        const siteLabel = getSiteLabel(d.site);
        const precoFmt  = d.preco ? `R$&nbsp;${d.preco.toFixed(2).replace('.', ',')}` : '—';
        const origFmt   = d.preco_original
          ? `<div class="price-original">de R$&nbsp;${d.preco_original.toFixed(2).replace('.', ',')}</div>`
          : '';
        const promoHtml = d.promocao
          ? `<span class="promo-badge">${d.promocao}</span>`
          : `<span class="promo-none">—</span>`;
        const dataCls   = d.data === hoje ? 'date-col date-today' : 'date-col';
        const nomeLabel = d.nome.length > 60 ? d.nome.slice(0, 58) + '…' : d.nome;

        return `
          <tr class="fade-in" style="animation-delay:${Math.min(i * 0.02, 0.3)}s">
            <td><span class="site-badge ${siteCls}">${siteLabel}</span></td>
            <td>
              <div class="prod-name" title="${escHtml(d.nome)}">${escHtml(nomeLabel)}</div>
              <div class="prod-query">${escHtml(d.produto_buscado || '')}</div>
            </td>
            <td class="price-col">
              <div class="price-main">${precoFmt}</div>
              ${origFmt}
            </td>
            <td>${promoHtml}</td>
            <td class="${dataCls}">${d.data}</td>
            <td class="link-col">
              <a href="${escHtml(d.link)}" target="_blank" rel="noopener" title="Abrir produto">↗</a>
            </td>
          </tr>`;
      }).join('');
    }

    // ── Helpers ───────────────────────────────────────────────
    function getSiteClass(site) {
      const s = (site || '').toLowerCase();
      if (s.includes('mercado'))   return 'ml';
      if (s.includes('amazon'))    return 'amz';
      if (s.includes('pague'))     return 'pm';
      if (s.includes('panvel'))    return 'panvel';
      return 'other';
    }
    function getSiteLabel(site) {
      const s = (site || '').toLowerCase();
      if (s.includes('mercado')) return '◈ ML';
      if (s.includes('amazon'))  return '◈ AMZ';
      if (s.includes('pague'))   return '◈ Pague Menos';
      if (s.includes('panvel'))  return '◈ Panvel';
      return '◈ ' + (site || '').replace('www.', '');
    }
    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
